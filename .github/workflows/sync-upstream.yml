name: Sync upstream

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: Silo-Server/silo-apple
  UPSTREAM_BRANCH: main
  XCODEGEN_VERSION: "2.43.0"

jobs:
  sync:
    name: Merge, validate, and update main
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out the fork main branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream on a temporary branch
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "blurbery"
          git config user.email "blurbery@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream "${UPSTREAM_BRANCH}"

          if git merge-base --is-ancestor "upstream/${UPSTREAM_BRANCH}" HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Fork main already contains the latest upstream commit."
            exit 0
          fi

          git switch -c "automation/upstream-sync-${GITHUB_RUN_ID}"
          git merge --no-ff --no-edit "upstream/${UPSTREAM_BRANCH}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Install pinned XcodeGen
        if: steps.merge.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen-dist"
          sudo "$RUNNER_TEMP/xcodegen-dist/xcodegen/install.sh" /usr/local
          xcodegen --version

      - name: Select Xcode 26
        if: steps.merge.outputs.changed == 'true'
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Generate the Xcode project
        if: steps.merge.outputs.changed == 'true'
        working-directory: iosApp
        run: xcodegen generate

      - name: Build iOS without signing
        if: steps.merge.outputs.changed == 'true'
        working-directory: iosApp
        run: |
          xcodebuild build \
            -project Silo.xcodeproj \
            -scheme Silo \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-iOS" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build tvOS without signing
        if: steps.merge.outputs.changed == 'true'
        working-directory: iosApp
        run: |
          xcodebuild build \
            -project Silo.xcodeproj \
            -scheme SiloTV \
            -destination 'generic/platform=tvOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-tvOS" \
            CODE_SIGNING_ALLOWED=NO

      - name: Advance fork main after validation
        if: steps.merge.outputs.changed == 'true'
        run: git push origin HEAD:main

      - name: Summarize a failed sync
        if: failure()
        shell: bash
        run: |
          {
            echo "## Upstream sync failed"
            echo
            echo "The fork's main branch was left unchanged. Review the failed step in this run."
          } >> "$GITHUB_STEP_SUMMARY"
