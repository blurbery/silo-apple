name: SiloTV personal test build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tvos-personal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'
      - name: Generate Xcode project
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.43.0/xcodegen.zip
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen-dist"
          "$RUNNER_TEMP/xcodegen-dist/xcodegen/bin/xcodegen" generate --spec iosApp/project.yml
      - name: Build tvOS app for personal signing
        run: |
          set -euo pipefail
          xcodebuild archive -project iosApp/Silo.xcodeproj -scheme SiloTV \
            -configuration Release -destination 'generic/platform=tvOS' \
            -archivePath "$RUNNER_TEMP/SiloTV.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/silo-derived" \
            MARKETING_VERSION=1.0.0 CURRENT_PROJECT_VERSION=35 \
            SILO_BUILD_CHANNEL=dev \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= CODE_SIGN_ENTITLEMENTS=
      - name: Package app and source revision
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tvos-device"
          git rev-parse HEAD > "$RUNNER_TEMP/tvos-device/source-sha.txt"
          ditto -c -k --keepParent \
            "$RUNNER_TEMP/SiloTV.xcarchive/Products/Applications/SiloTV.app" \
            "$RUNNER_TEMP/tvos-device/SiloTV-device.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: SiloTV-device
          path: ${{ runner.temp }}/tvos-device/
          if-no-files-found: error
          retention-days: 3
